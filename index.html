.foot{margin-top:28px;color:var(--mut);font-size:12.5px;text-align:center}
#viewer{display:none;position:fixed;inset:0;flex-direction:column;background:var(--bg)}
#viewer.on{display:flex}

#bar button.on{background:#fff;color:#17365d}

<script>
(function(){
